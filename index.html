
<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>首席图像架构师 | Chief Image Architect</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23111'/><text y='.85em' font-size='60' x='20' fill='white' font-family='sans-serif' font-weight='700'>K</text></svg>">
  <link rel="stylesheet" href="index.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            heading: ['Space Grotesk', 'sans-serif'],
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            theme: {
              primary: 'var(--theme-primary)',
              'primary-light': 'var(--theme-primary-light)',
              'primary-dark': 'var(--theme-primary-dark)',
              accent: 'var(--theme-accent)',
              'accent-light': 'var(--theme-accent-light)',
            }
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --indigo-glow: rgba(79, 70, 229, 0.4);
      --bg-color: #0a0a0a;
      --grid-color: rgba(255, 255, 255, 0.02);
    }
    html.light {
      --bg-color: #f8fafc;
      --grid-color: rgba(15, 23, 42, 0.04);
    }
    
    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      transition: background-color 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      min-height: 100vh;
      overflow: hidden;
    }
    
    .bg-grid {
      background-size: 50px 50px;
      background-image: 
        linear-gradient(to right, var(--grid-color) 1px, transparent 1px),
        linear-gradient(to bottom, var(--grid-color) 1px, transparent 1px);
    }

    .custom-scrollbar::-webkit-scrollbar {
      height: 4px;
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 10px;
    }
    
    .glass-card {
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    
    #root {
      height: 100vh;
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes slideInFromBottom {
      from { transform: translateY(1rem); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes slideInFromLeft {
      from { transform: translateX(-1rem); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    @keyframes slideInFromTop {
      from { transform: translateY(-1rem); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes zoomIn {
      from { transform: scale(0.98); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .animate-in {
      animation-duration: 400ms;
      animation-fill-mode: both;
      animation-timing-function: cubic-bezier(0, 0, 0.2, 1);
    }
    .fade-in { animation-name: fadeIn; }
    .slide-in-from-bottom-4 { animation-name: slideInFromBottom; }
    .slide-in-from-left-4 { animation-name: slideInFromLeft; }
    .slide-in-from-top-4 { animation-name: slideInFromTop; }
    .zoom-in { animation-name: zoomIn; }

    /* 霓虹荧光笔高亮 */
    .weighted-block {
      display: inline-block;
      background: rgba(99, 102, 241, 0.15);
      box-shadow: 0 0 15px rgba(99, 102, 241, 0.1);
      color: #6366f1;
      padding: 0 8px;
      margin: 0 2px;
      border-radius: 8px;
      border-bottom: 3px solid rgba(99, 102, 241, 0.8);
      font-weight: 900;
      font-size: 1.1em;
      vertical-align: middle;
      transition: all 0.2s ease;
      line-height: 1.1;
      white-space: nowrap;
      user-select: all;
      cursor: default;
    }
    .dark .weighted-block {
      color: #a5b4fc;
      background: rgba(99, 102, 241, 0.2);
    }
    
    .weight-marker {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }
  </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom": "https://esm.sh/react-dom@^19.2.4",
    "react-dom/client": "https://esm.sh/react-dom@^19.2.4/client",
    "@google/genai": "https://esm.sh/@google/genai@1.35.0"
  }
}
</script>
</head>
<body class="bg-grid">
  <div id="root"></div>
  <script type="module" src="./index.tsx"></script>
</body>
</html>
