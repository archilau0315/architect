<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>字体大小测试</title>
  <style>
    :root {
      --base-font-size: 14px;
    }

    body {
      font-size: var(--base-font-size, 14px);
      padding: 20px;
      font-family: sans-serif;
    }

    .test-area {
      margin: 20px 0;
      padding: 20px;
      border: 2px solid #ccc;
      border-radius: 8px;
    }

    button {
      margin: 5px;
      padding: 10px 20px;
      cursor: pointer;
      border: 2px solid #333;
      border-radius: 5px;
      background: white;
    }

    button:hover {
      background: #f0f0f0;
    }

    .current-size {
      font-weight: bold;
      color: #0066cc;
      margin: 10px 0;
    }
  </style>
</head>
<body>
  <h1>字体大小测试页面</h1>

  <div class="test-area">
    <h2>当前字体大小</h2>
    <p class="current-size" id="currentSize">14px</p>
    <p>这是一段测试文字。This is a test text. これはテストテキストです。</p>
  </div>

  <div class="test-area">
    <h2>字体大小控制</h2>
    <button onclick="setFontSize('12px')">小号 (12px)</button>
    <button onclick="setFontSize('14px')">标准 (14px)</button>
    <button onclick="setFontSize('16px')">大号 (16px)</button>
    <button onclick="setFontSize('18px')">特大 (18px)</button>
    <button onclick="setFontSize('20px')">超大 (20px)</button>
  </div>

  <div class="test-area">
    <h2>效果演示</h2>
    <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
    <p>这是一段中文测试文字，用于观察字体大小变化。</p>
    <p>これは日本語のテストテキストです。フォントサイズの変化を観察します。</p>
    <ul>
      <li>列表项目 1</li>
      <li>列表项目 2</li>
      <li>列表项目 3</li>
    </ul>
  </div>

  <script>
    function setFontSize(size) {
      document.documentElement.style.setProperty('--base-font-size', size);
      document.getElementById('currentSize').textContent = size;
      console.log('字体大小已设置为:', size);
      console.log('CSS 变量值:', getComputedStyle(document.documentElement).getPropertyValue('--base-font-size'));
      console.log('body font-size:', getComputedStyle(document.body).fontSize);
    }

    // 页面加载时显示当前字体大小
    window.onload = function() {
      const currentSize = getComputedStyle(document.documentElement).getPropertyValue('--base-font-size').trim();
      document.getElementById('currentSize').textContent = currentSize || '14px';
      console.log('初始字体大小:', currentSize);
    };
  </script>
</body>
</html>
