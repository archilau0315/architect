<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>清理缓存</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            padding: 20px; 
            max-width: 800px;
            margin: 0 auto;
        }
        .button {
            background: #4f46e5;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px 0;
        }
        .button:hover {
            background: #4338ca;
        }
        .success { 
            background: #ccffcc; 
            padding: 15px; 
            margin: 10px 0;
            border-radius: 8px;
        }
        .info { 
            background: #f0f0f0; 
            padding: 15px; 
            margin: 10px 0;
            border-radius: 8px;
        }
        code {
            background: #e0e0e0;
            padding: 2px 6px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h1>首席图像架构师 - 缓存清理工具</h1>
    
    <div class="info">
        <h2>问题说明</h2>
        <p>如果您看到 <code>@vite/client</code> 404错误，说明浏览器加载了开发版本的代码。</p>
        <p>请点击下面的按钮清理缓存，然后重新访问应用。</p>
    </div>
    
    <div class="info">
        <h2>自动清理</h2>
        <button class="button" onclick="clearAllCache()">清理所有缓存并刷新</button>
        <div id="result"></div>
    </div>
    
    <div class="info">
        <h2>手动清理步骤</h2>
        <ol>
            <li>按 <code>Ctrl+Shift+Delete</code> 打开清除浏览数据</li>
            <li>选择"缓存的图像和文件"</li>
            <li>时间范围选择"所有时间"</li>
            <li>点击"清除数据"</li>
            <li>关闭浏览器所有标签页</li>
            <li>重新打开浏览器访问应用</li>
        </ol>
    </div>
    
    <div class="info">
        <h2>强制刷新</h2>
        <p>在应用页面按以下快捷键：</p>
        <ul>
            <li>Windows: <code>Ctrl+F5</code> 或 <code>Ctrl+Shift+R</code></li>
            <li>Mac: <code>Cmd+Shift+R</code></li>
        </ul>
    </div>
    
    <script>
        function clearAllCache() {
            const result = document.getElementById('result');
            result.innerHTML = '<p>正在清理缓存...</p>';
            
            // 清理localStorage
            try {
                const keys = [];
                for (let i = 0; i < localStorage.length; i++) {
                    keys.push(localStorage.key(i));
                }
                keys.forEach(key => {
                    if (key && key.includes('architect')) {
                        localStorage.removeItem(key);
                    }
                });
            } catch (e) {
                console.error('清理localStorage失败:', e);
            }
            
            // 清理sessionStorage
            try {
                const keys = [];
                for (let i = 0; i < sessionStorage.length; i++) {
                    keys.push(sessionStorage.key(i));
                }
                keys.forEach(key => {
                    if (key && key.includes('architect')) {
                        sessionStorage.removeItem(key);
                    }
                });
            } catch (e) {
                console.error('清理sessionStorage失败:', e);
            }
            
            // 尝试清理Service Worker
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(registrations => {
                    registrations.forEach(registration => {
                        registration.unregister();
                    });
                });
            }
            
            // 尝试清理缓存
            if ('caches' in window) {
                caches.keys().then(cacheNames => {
                    cacheNames.forEach(cacheName => {
                        caches.delete(cacheName);
                    });
                });
            }
            
            result.innerHTML = `
                <div class="success">
                    <p>✅ 缓存清理完成！</p>
                    <p>3秒后将自动跳转到应用页面...</p>
                </div>
            `;
            
            setTimeout(() => {
                window.location.href = '/architect/?nocache=' + Date.now();
            }, 3000);
        }
        
        // 自动检测是否有vite客户端请求
        const observer = new PerformanceObserver((list) => {
            for (const entry of list.getEntries()) {
                if (entry.name.includes('@vite')) {
                    console.warn('检测到Vite客户端请求:', entry.name);
                }
            }
        });
        if (typeof PerformanceObserver !== 'undefined') {
            observer.observe({ entryTypes: ['resource'] });
        }
    </script>
</body>
</html>
