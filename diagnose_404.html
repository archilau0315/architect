<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>诊断页面</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .info { background: #f0f0f0; padding: 10px; margin: 10px 0; }
        .error { background: #ffcccc; padding: 10px; margin: 10px 0; }
        .success { background: #ccffcc; padding: 10px; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>首席图像架构师 - 诊断页面</h1>
    
    <div class="info">
        <h2>浏览器信息</h2>
        <p>User Agent: <span id="ua"></span></p>
        <p>当前URL: <span id="url"></span></p>
        <p>时间: <span id="time"></span></p>
    </div>
    
    <div class="info">
        <h2>缓存检测</h2>
        <p>LocalStorage中是否有旧数据: <span id="localStorage"></span></p>
        <p>SessionStorage中是否有旧数据: <span id="sessionStorage"></span></p>
    </div>
    
    <div id="results"></div>
    
    <script>
        // 显示基本信息
        document.getElementById('ua').textContent = navigator.userAgent;
        document.getElementById('url').textContent = window.location.href;
        document.getElementById('time').textContent = new Date().toISOString();
        
        // 检查LocalStorage
        let hasLocalData = false;
        try {
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && key.includes('architect')) {
                    hasLocalData = true;
                    break;
                }
            }
        } catch (e) {}
        document.getElementById('localStorage').textContent = hasLocalData ? '有' : '无';
        
        // 检查SessionStorage
        let hasSessionData = false;
        try {
            for (let i = 0; i < sessionStorage.length; i++) {
                const key = sessionStorage.key(i);
                if (key && key.includes('architect')) {
                    hasSessionData = true;
                    break;
                }
            }
        } catch (e) {}
        document.getElementById('sessionStorage').textContent = hasSessionData ? '有' : '无';
        
        // 检测资源加载
        const results = document.getElementById('results');
        
        function checkResource(url, name) {
            const div = document.createElement('div');
            div.className = 'info';
            div.innerHTML = `<h3>检测: ${name}</h3><p>URL: ${url}</p><p>状态: 检测中...</p>`;
            results.appendChild(div);
            
            fetch(url, { method: 'HEAD' })
                .then(response => {
                    if (response.ok) {
                        div.className = 'success';
                        div.innerHTML = `<h3>✅ ${name}</h3><p>URL: ${url}</p><p>状态: ${response.status} - 正常</p>`;
                    } else {
                        div.className = 'error';
                        div.innerHTML = `<h3>❌ ${name}</h3><p>URL: ${url}</p><p>状态: ${response.status} - 错误</p>`;
                    }
                })
                .catch(error => {
                    div.className = 'error';
                    div.innerHTML = `<h3>❌ ${name}</h3><p>URL: ${url}</p><p>错误: ${error.message}</p>`;
                });
        }
        
        // 检测关键资源
        const basePath = '/architect/';
        checkResource(basePath + 'assets/index-ECCFgKZ2.js', '主JS文件');
        checkResource(basePath + 'assets/index-DROmHbkc.css', 'CSS文件');
        checkResource(basePath + 'index.html', 'HTML文件');
        
        // 检测是否有vite客户端文件请求
        const observer = new PerformanceObserver((list) => {
            for (const entry of list.getEntries()) {
                if (entry.name.includes('@vite')) {
                    const div = document.createElement('div');
                    div.className = 'error';
                    div.innerHTML = `<h3>⚠️ 发现Vite客户端请求</h3><p>URL: ${entry.name}</p><p>这表示浏览器正在加载开发版本代码</p>`;
                    results.appendChild(div);
                }
            }
        });
        observer.observe({ entryTypes: ['resource'] });
    </script>
</body>
</html>
