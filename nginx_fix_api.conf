# 首席图像架构师 - 修复API路由配置
# 部署路径: www.kbitai.com.cn/architect/

server {
    listen 80;
    listen 443 ssl http2;
    server_name www.kbitai.com.cn kbitai.com.cn;

    root /www/wwwroot/kbitai.com.cn;
    index index.html index.php;

    # ============================================
    # API路由修复 - 关键配置
    # ============================================

    # API请求转发到PHP后端
    location /api/ {
        rewrite ^/api/(.*)$ /architect/bankend/index.php last;
    }

    # ============================================
    # 首席图像架构师 - 子应用配置
    # ============================================

    # 前端静态资源
    location /architect {
        alias /www/wwwroot/kbitai.com.cn/architect;
        index index.html;
        try_files $uri $uri/ /architect/index.html;

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }
