# 在 location /architect/backend 之前添加这段配置

# API路由 - 转发到PHP后端
location /api/ {
    alias /www/wwwroot/kbitai.com.cn/architect/bankend/;

    # 重写规则：/api/* -> /architect/bankend/index.php
    if (!-e $request_filename) {
        rewrite ^/api/(.*)$ /architect/bankend/index.php last;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/tmp/php-cgi-82.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /www/wwwroot/kbitai.com.cn/architect/bankend/index.php;
        fastcgi_param REQUEST_URI $request_uri;
        include fastcgi_params;

        fastcgi_connect_timeout 300;
        fastcgi_send_timeout 300;
        fastcgi_read_timeout 300;
    }
}
