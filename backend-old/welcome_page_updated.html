<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>匡形无界（Kbitai）- 开启内测</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0a192f 0%, #112240 50%, #233554 100%);
            padding: 20px;
            color: #fff;
        }
        .main-text {
            text-align: center;
            line-height: 1.8;
            background: rgba(255, 255, 255, 0.05);
            padding: 40px 60px;
            border-radius: 12px;
            border: 1px solid rgba(100, 150, 255, 0.2);
        }
        .hello-world {
            font-family: 'Noto Sans SC', sans-serif;
            font-weight: 900;
            font-size: 6vw;
            background: linear-gradient(90deg, #ff9a00, #ffd700, #ffeb3b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-fill-color: transparent;
            margin-bottom: 20px;
            animation: flicker-hello 3s infinite ease-in-out;
        }
        @keyframes flicker-hello {
            0%, 100% {
                opacity: 1;
                filter: brightness(1);
            }
            50% {
                opacity: 0.92;
                filter: brightness(1.08);
            }
        }
        .content {
            font-family: 'Noto Sans SC', sans-serif;
            font-size: 3vw;
            color: #e5e7eb;
            font-weight: 400;
            margin-bottom: 40px;
        }
        .coming-soon {
            display: block;
            margin-top: 15px;
            font-size: 2.8vw;
            color: #d1d5db;
        }
        .highlight {
            font-weight: 700;
            color: #ff4500;
            font-size: 4vw;
            margin: 0 5px;
            text-shadow: 0 0 12px rgba(255, 69, 0, 0.7), 0 2px 4px rgba(0, 0, 0, 0.3);
            animation: flicker-highlight 2.5s infinite ease-in-out;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        .highlight:hover {
            color: #ff6b35;
            text-shadow: 0 0 20px rgba(255, 69, 0, 0.9), 0 2px 4px rgba(0, 0, 0, 0.3);
        }
        @keyframes flicker-highlight {
            0%, 100% {
                opacity: 1;
                text-shadow: 0 0 12px rgba(255, 69, 0, 0.7), 0 2px 4px rgba(0, 0, 0, 0.3);
            }
            50% {
                opacity: 0.95;
                text-shadow: 0 0 18px rgba(255, 69, 0, 0.95), 0 2px 4px rgba(0, 0, 0, 0.3);
            }
        }
        .slogan {
            margin-top: 20px;
            border-top: 1px solid rgba(100, 150, 255, 0.2);
            padding-top: 30px;
            margin-bottom: 20px;
        }
        .slogan-cn {
            font-family: 'Noto Sans SC', sans-serif;
            font-size: 2.5vw;
            color: #d1d5db;
            font-weight: 700;
            margin-bottom: 10px;
        }
        .slogan-en {
            font-family: 'Noto Sans SC', sans-serif;
            font-size: 2vw;
            color: #94a3b8;
            letter-spacing: 2px;
        }
        .website {
            font-family: 'Noto Sans SC', sans-serif;
            font-size: 1.8vw;
            color: #64ffda;
            margin-top: 10px;
            text-decoration: none;
        }
        .website:hover {
            text-decoration: underline;
        }
        @media (max-width: 768px) {
            .hello-world {
                font-size: 8vw;
            }
            .content {
                font-size: 4vw;
            }
            .highlight {
                font-size: 5vw;
            }
            .coming-soon {
                font-size: 3.8vw;
            }
            .slogan-cn {
                font-size: 3.5vw;
            }
            .slogan-en {
                font-size: 2.5vw;
            }
            .website {
                font-size: 2.2vw;
            }
            .main-text {
                padding: 20px 30px;
            }
        }
    </style>
</head>
<body>
    <div class="main-text">
        <div class="hello-world">Hello World！！！</div>
        <div class="content">
            匡形无界（Kbitai）开发的<a href="/architect/" class="highlight">首席图像架构师</a>已开启内测。
            <span class="coming-soon">与我同行!</span>
        </div>
        <div class="slogan">
            <div class="slogan-cn">设计有形   科技无界</div>
            <div class="slogan-en">FINITE FORM INFINITE TECH</div>
        </div>
        <a href="https://kbitai.com.cn" class="website" target="_blank">https://kbitai.com.cn</a>
    </div>
</body>
</html>
