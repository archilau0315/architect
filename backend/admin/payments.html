<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>支付订单 - 管理员后台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4F46E5',
                        secondary: '#7C3AED',
                        success: '#10B981',
                        warning: '#F59E0B',
                        danger: '#EF4444',
                        info: '#3B82F6',
                    },
                    fontFamily: {
                        inter: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .bg-gradient-primary {
                background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%);
            }
        }
    </style>
</head>
<body class="bg-gray-50 font-inter">
    <div class="flex h-screen overflow-hidden">
        <div class="w-64 bg-gray-900 text-white flex flex-col">
            <div class="p-6 border-b border-gray-800">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 bg-gradient-primary rounded-lg flex items-center justify-center">
                        <i class="fa fa-shield text-white"></i>
                    </div>
                    <div>
                        <h1 class="text-lg font-bold">管理员后台</h1>
                        <p class="text-xs text-gray-400">首席图像架构师</p>
                    </div>
                </div>
            </div>
            <nav class="flex-1 p-4 space-y-1">
                <a href="dashboard.html" class="flex items-center space-x-3 px-4 py-3 rounded-lg text-gray-300 hover:bg-gray-800 hover:text-white transition-colors">
                    <i class="fa fa-dashboard w-5 text-center"></i>
                    <span>仪表盘</span>
                </a>
                <a href="users.html" class="flex items-center space-x-3 px-4 py-3 rounded-lg text-gray-300 hover:bg-gray-800 hover:text-white transition-colors">
                    <i class="fa fa-users w-5 text-center"></i>
                    <span>用户管理</span>
                </a>
                <a href="payments.html" class="flex items-center space-x-3 px-4 py-3 rounded-lg bg-gray-800 text-white">
                    <i class="fa fa-money w-5 text-center"></i>
                    <span>支付订单</span>
                    <span id="pendingBadge" class="ml-auto bg-danger text-white text-[10px] px-2 py-0.5 rounded-full hidden">0</span>
                </a>
                <a href="beta.html" class="flex items-center space-x-3 px-4 py-3 rounded-lg text-gray-300 hover:bg-gray-800 hover:text-white transition-colors">
                    <i class="fa fa-envelope w-5 text-center"></i>
                    <span>内测申请</span>
                </a>
                <a href="models.html" class="flex items-center space-x-3 px-4 py-3 rounded-lg text-gray-300 hover:bg-gray-800 hover:text-white transition-colors">
                    <i class="fa fa-cogs w-5 text-center"></i>
                    <span>模型配置</span>
                </a>
                <a href="logs.html" class="flex items-center space-x-3 px-4 py-3 rounded-lg text-gray-300 hover:bg-gray-800 hover:text-white transition-colors">
                    <i class="fa fa-file-text w-5 text-center"></i>
                    <span>系统日志</span>
                </a>
            </nav>
        </div>

        <div class="flex-1 overflow-y-auto">
            <div class="p-8">
                <div class="flex items-center justify-between mb-8">
                    <div>
                        <h2 class="text-2xl font-bold text-gray-900">支付订单管理</h2>
                        <p class="text-gray-500 mt-1">审核用户充值订单，确认收款后积分自动到账</p>
                    </div>
                    <div class="flex items-center gap-3">
                        <select id="statusFilter" class="border border-gray-300 rounded-lg px-4 py-2 text-sm focus:ring-2 focus:ring-primary focus:border-primary">
                            <option value="pending">待审核</option>
                            <option value="verified">已通过</option>
                            <option value="rejected">已拒绝</option>
                            <option value="all">全部</option>
                        </select>
                        <button onclick="loadOrders()" class="px-4 py-2 bg-primary text-white rounded-lg text-sm hover:bg-primary/90 transition-colors">
                            <i class="fa fa-refresh mr-1"></i>刷新
                        </button>
                    </div>
                </div>

                <div id="ordersTable" class="bg-white rounded-xl shadow-sm overflow-hidden">
                    <div class="p-12 text-center text-gray-400">
                        <i class="fa fa-spinner fa-spin text-2xl mb-3"></i>
                        <p>加载中...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="verifyModal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-2xl p-8 max-w-md w-full mx-4">
            <h3 class="text-lg font-bold text-gray-900 mb-4">确认审核通过</h3>
            <p class="text-sm text-gray-500 mb-2">订单号: <span id="verifyOrderNo" class="font-mono"></span></p>
            <p class="text-sm text-gray-500 mb-2">用户: <span id="verifyUser"></span></p>
            <p class="text-sm text-gray-500 mb-2">金额: <span id="verifyAmount" class="text-lg font-bold text-green-600"></span></p>
            <p class="text-sm text-gray-500 mb-4">积分: <span id="verifyPoints" class="text-lg font-bold text-blue-600"></span></p>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">管理员备注</label>
                <input type="text" id="verifyNote" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm" placeholder="可选备注">
            </div>
            <div class="flex gap-3">
                <button onclick="closeVerifyModal()" class="flex-1 px-4 py-2 border border-gray-300 rounded-lg text-sm text-gray-700 hover:bg-gray-50">取消</button>
                <button onclick="confirmVerify()" class="flex-1 px-4 py-2 bg-success text-white rounded-lg text-sm hover:bg-success/90">确认通过并充值</button>
            </div>
        </div>
    </div>

    <div id="rejectModal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-2xl p-8 max-w-md w-full mx-4">
            <h3 class="text-lg font-bold text-gray-900 mb-4">拒绝订单</h3>
            <p class="text-sm text-gray-500 mb-4">订单号: <span id="rejectOrderNo" class="font-mono"></span></p>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">拒绝原因</label>
                <input type="text" id="rejectNote" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm" placeholder="请输入拒绝原因">
            </div>
            <div class="flex gap-3">
                <button onclick="closeRejectModal()" class="flex-1 px-4 py-2 border border-gray-300 rounded-lg text-sm text-gray-700 hover:bg-gray-50">取消</button>
                <button onclick="confirmReject()" class="flex-1 px-4 py-2 bg-danger text-white rounded-lg text-sm hover:bg-danger/90">确认拒绝</button>
            </div>
        </div>
    </div>

    <script>
        const API = window.location.hostname === 'localhost' ? 'http://localhost:3001' : 'https://api.kbitai.com.cn';
        let currentOrderId = null;
        let token = localStorage.getItem('adminToken');

        function getAuthHeaders() {
            return {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            };
        }

        async function loadPendingCount() {
            try {
                const res = await fetch(`${API}/api/payment/pending-count`);
                const data = await res.json();
                if (data.success && data.data.count > 0) {
                    const badge = document.getElementById('pendingBadge');
                    badge.textContent = data.data.count;
                    badge.classList.remove('hidden');
                }
            } catch (e) {}
        }

        async function loadOrders() {
            const status = document.getElementById('statusFilter').value;
            const container = document.getElementById('ordersTable');
            container.innerHTML = '<div class="p-12 text-center text-gray-400"><i class="fa fa-spinner fa-spin text-2xl mb-3"></i><p>加载中...</p></div>';

            try {
                const res = await fetch(`${API}/api/admin/payment-orders?status=${status}`, {
                    headers: getAuthHeaders()
                });
                const data = await res.json();

                if (!data.success) {
                    container.innerHTML = `<div class="p-12 text-center text-red-400"><p>${data.error || '加载失败'}</p></div>`;
                    return;
                }

                const orders = data.data.orders;
                if (orders.length === 0) {
                    container.innerHTML = '<div class="p-12 text-center text-gray-400"><i class="fa fa-inbox text-4xl mb-3"></i><p>暂无订单</p></div>';
                    return;
                }

                let html = `<table class="w-full">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">订单号</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">用户</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">类型</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">金额</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">积分</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">支付方式</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">状态</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">时间</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">操作</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-200">`;

                orders.forEach(order => {
                    const statusMap = {
                        pending: '<span class="px-2 py-1 text-xs font-medium rounded-full bg-warning/10 text-warning">待审核</span>',
                        verified: '<span class="px-2 py-1 text-xs font-medium rounded-full bg-success/10 text-success">已通过</span>',
                        rejected: '<span class="px-2 py-1 text-xs font-medium rounded-full bg-danger/10 text-danger">已拒绝</span>',
                        expired: '<span class="px-2 py-1 text-xs font-medium rounded-full bg-gray-200 text-gray-500">已过期</span>'
                    };
                    const typeMap = { topup: '积分充值', subscription: '订阅' };
                    const methodMap = { wechat: '微信', alipay: '支付宝' };

                    html += `<tr class="hover:bg-gray-50">
                        <td class="px-6 py-4 text-sm font-mono text-gray-900">${order.order_no}</td>
                        <td class="px-6 py-4 text-sm text-gray-600">${order.user_email || order.user_id}</td>
                        <td class="px-6 py-4 text-sm text-gray-600">${typeMap[order.type] || order.type}</td>
                        <td class="px-6 py-4 text-sm font-semibold text-green-600">¥${parseFloat(order.amount_cny).toFixed(2)}</td>
                        <td class="px-6 py-4 text-sm font-semibold text-blue-600">${order.points}</td>
                        <td class="px-6 py-4 text-sm text-gray-600">${methodMap[order.payment_method] || '-'}</td>
                        <td class="px-6 py-4">${statusMap[order.status] || order.status}</td>
                        <td class="px-6 py-4 text-sm text-gray-400">${new Date(order.created_at).toLocaleString('zh-CN')}</td>
                        <td class="px-6 py-4 text-sm">`;

                    if (order.status === 'pending') {
                        html += `<button onclick="openVerifyModal(${order.id}, '${order.order_no}', '${order.user_email || order.user_id}', ${order.amount_cny}, ${order.points})" class="px-3 py-1 bg-success text-white rounded text-xs hover:bg-success/90 mr-1">通过</button>`;
                        html += `<button onclick="openRejectModal(${order.id}, '${order.order_no}')" class="px-3 py-1 bg-danger text-white rounded text-xs hover:bg-danger/90">拒绝</button>`;
                    } else {
                        html += `<span class="text-xs text-gray-400">${order.admin_note || '-'}</span>`;
                    }

                    html += `</td></tr>`;
                });

                html += '</tbody></table>';
                container.innerHTML = html;
            } catch (e) {
                container.innerHTML = '<div class="p-12 text-center text-red-400"><p>网络错误</p></div>';
            }
        }

        function openVerifyModal(id, orderNo, user, amount, points) {
            currentOrderId = id;
            document.getElementById('verifyOrderNo').textContent = orderNo;
            document.getElementById('verifyUser').textContent = user;
            document.getElementById('verifyAmount').textContent = `¥${parseFloat(amount).toFixed(2)}`;
            document.getElementById('verifyPoints').textContent = points;
            document.getElementById('verifyNote').value = '';
            document.getElementById('verifyModal').classList.remove('hidden');
        }

        function closeVerifyModal() {
            document.getElementById('verifyModal').classList.add('hidden');
            currentOrderId = null;
        }

        async function confirmVerify() {
            if (!currentOrderId) return;
            const note = document.getElementById('verifyNote').value;
            try {
                const res = await fetch(`${API}/api/admin/payment-orders/${currentOrderId}/verify`, {
                    method: 'POST',
                    headers: getAuthHeaders(),
                    body: JSON.stringify({ adminNote: note })
                });
                const data = await res.json();
                if (data.success) {
                    alert(data.message);
                    closeVerifyModal();
                    loadOrders();
                    loadPendingCount();
                } else {
                    alert(data.error || '操作失败');
                }
            } catch (e) {
                alert('网络错误');
            }
        }

        function openRejectModal(id, orderNo) {
            currentOrderId = id;
            document.getElementById('rejectOrderNo').textContent = orderNo;
            document.getElementById('rejectNote').value = '';
            document.getElementById('rejectModal').classList.remove('hidden');
        }

        function closeRejectModal() {
            document.getElementById('rejectModal').classList.add('hidden');
            currentOrderId = null;
        }

        async function confirmReject() {
            if (!currentOrderId) return;
            const note = document.getElementById('rejectNote').value;
            if (!note.trim()) {
                alert('请输入拒绝原因');
                return;
            }
            try {
                const res = await fetch(`${API}/api/admin/payment-orders/${currentOrderId}/reject`, {
                    method: 'POST',
                    headers: getAuthHeaders(),
                    body: JSON.stringify({ adminNote: note })
                });
                const data = await res.json();
                if (data.success) {
                    alert(data.message);
                    closeRejectModal();
                    loadOrders();
                    loadPendingCount();
                } else {
                    alert(data.error || '操作失败');
                }
            } catch (e) {
                alert('网络错误');
            }
        }

        document.getElementById('statusFilter').addEventListener('change', loadOrders);

        loadOrders();
        loadPendingCount();
        setInterval(() => { loadPendingCount(); }, 30000);
    </script>
</body>
</html>
