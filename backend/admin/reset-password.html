<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>重置密码 - 管理员后台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4F46E5',
                        secondary: '#7C3AED',
                    },
                    fontFamily: {
                        inter: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .bg-gradient-primary {
                background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%);
            }
            .shadow-login {
                box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center font-inter">
    <div class="w-full max-w-md p-8">
        <div class="bg-white rounded-2xl shadow-login p-8 space-y-6">
            <div class="text-center">
                <div class="w-16 h-16 mx-auto bg-gradient-primary rounded-full flex items-center justify-center mb-6">
                    <i class="fa fa-key text-white text-2xl"></i>
                </div>
                <h1 class="text-2xl font-bold text-gray-900">重置密码</h1>
                <p class="text-gray-500 mt-2">请设置新的管理员密码</p>
            </div>
            
            <form id="resetPasswordForm" class="space-y-4">
                <input type="hidden" id="token" value="">
                
                <div>
                    <label for="newPassword" class="block text-sm font-medium text-gray-700 mb-1">新密码</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fa fa-lock text-gray-400"></i>
                        </div>
                        <input type="password" id="newPassword" name="newPassword" required
                            class="w-full pl-10 pr-10 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all"
                            placeholder="请输入新密码（至少8位）">
                        <button type="button" id="togglePassword" class="absolute inset-y-0 right-0 pr-3 flex items-center">
                            <i class="fa fa-eye text-gray-400"></i>
                        </button>
                    </div>
                </div>
                
                <div>
                    <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-1">确认密码</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fa fa-lock text-gray-400"></i>
                        </div>
                        <input type="password" id="confirmPassword" name="confirmPassword" required
                            class="w-full pl-10 pr-3 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all"
                            placeholder="请再次输入密码">
                    </div>
                </div>
                
                <button type="submit" id="resetButton"
                    class="w-full bg-gradient-primary text-white py-3 px-4 rounded-lg font-medium hover:opacity-90 transition-opacity flex items-center justify-center space-x-2">
                    <i class="fa fa-refresh"></i>
                    <span>重置密码</span>
                </button>
            </form>
            
            <!-- 成功提示 -->
            <div id="successMessage" class="p-4 bg-green-50 border border-green-200 rounded-lg hidden">
                <div class="flex items-center text-green-700">
                    <i class="fa fa-check-circle mr-2"></i>
                    <span>密码重置成功！<a href="index.html" class="text-primary hover:underline">点击登录</a></span>
                </div>
            </div>
            
            <!-- 错误提示 -->
            <div id="errorMessage" class="p-4 bg-red-50 border border-red-200 rounded-lg hidden">
                <div class="flex items-center text-red-700">
                    <i class="fa fa-exclamation-circle mr-2"></i>
                    <span id="errorText"></span>
                </div>
            </div>
        </div>
        
        <div class="text-center mt-6 text-sm text-gray-500">
            <p>© 2026 首席图像架构师 - 管理员后台</p>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 从URL获取token
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            document.getElementById('token').value = token || '';
            
            if (!token) {
                document.getElementById('errorText').textContent = '无效的重置链接';
                document.getElementById('errorMessage').classList.remove('hidden');
                document.getElementById('resetPasswordForm').classList.add('hidden');
                return;
            }
            
            // 切换密码可见性
            const togglePassword = document.getElementById('togglePassword');
            const newPassword = document.getElementById('newPassword');
            
            togglePassword.addEventListener('click', function() {
                const type = newPassword.getAttribute('type') === 'password' ? 'text' : 'password';
                newPassword.setAttribute('type', type);
                this.querySelector('i').className = type === 'password' ? 'fa fa-eye text-gray-400' : 'fa fa-eye-slash text-gray-400';
            });
            
            // 提交重置密码表单
            const resetPasswordForm = document.getElementById('resetPasswordForm');
            const resetButton = document.getElementById('resetButton');
            
            resetPasswordForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const newPasswordVal = document.getElementById('newPassword').value;
                const confirmPasswordVal = document.getElementById('confirmPassword').value;
                
                // 密码校验
                if (newPasswordVal.length < 8) {
                    document.getElementById('errorText').textContent = '新密码至少需要8个字符';
                    document.getElementById('errorMessage').classList.remove('hidden');
                    return;
                }
                
                if (newPasswordVal !== confirmPasswordVal) {
                    document.getElementById('errorText').textContent = '两次输入的密码不一致';
                    document.getElementById('errorMessage').classList.remove('hidden');
                    return;
                }
                
                // 隐藏错误提示
                document.getElementById('errorMessage').classList.add('hidden');
                
                resetButton.disabled = true;
                resetButton.innerHTML = '<i class="fa fa-spinner fa-spin"></i><span>重置中...</span>';
                
                fetch('/api/admin/reset-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Requested-With': 'XMLHttpRequest'
                    },
                    body: JSON.stringify({
                        token: token,
                        newPassword: newPasswordVal
                    })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        document.getElementById('successMessage').classList.remove('hidden');
                        resetPasswordForm.reset();
                        resetPasswordForm.classList.add('hidden');
                    } else {
                        document.getElementById('errorText').textContent = data.error || '重置失败';
                        document.getElementById('errorMessage').classList.remove('hidden');
                    }
                    resetButton.disabled = false;
                    resetButton.innerHTML = '<i class="fa fa-refresh"></i><span>重置密码</span>';
                })
                .catch(error => {
                    console.error('重置密码错误:', error);
                    document.getElementById('errorText').textContent = '网络错误，请稍后重试';
                    document.getElementById('errorMessage').classList.remove('hidden');
                    resetButton.disabled = false;
                    resetButton.innerHTML = '<i class="fa fa-refresh"></i><span>重置密码</span>';
                });
            });
        });
    </script>
</body>
</html>
