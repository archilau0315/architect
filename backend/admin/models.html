<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统配置 - 管理员后台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4F46E5',
                        secondary: '#7C3AED',
                        success: '#10B981',
                        warning: '#F59E0B',
                        danger: '#EF4444',
                        info: '#3B82F6',
                    },
                    fontFamily: {
                        inter: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .bg-gradient-primary {
                background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%);
            }
            .card-shadow {
                box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            }
        }
    </style>
</head>
<body class="bg-gray-50 font-inter">
    <!-- 侧边栏 -->
    <div class="flex h-screen overflow-hidden">
        <div class="w-64 bg-gray-900 text-white flex flex-col">
            <div class="p-6 border-b border-gray-800">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 bg-gradient-primary rounded-lg flex items-center justify-center">
                        <i class="fa fa-shield text-white"></i>
                    </div>
                    <div>
                        <h1 class="text-lg font-bold">管理员后台</h1>
                        <p class="text-xs text-gray-400">首席图像架构师</p>
                    </div>
                </div>
            </div>
            
            <nav class="flex-1 p-4 space-y-1">
                <a href="dashboard.html" class="flex items-center space-x-3 px-4 py-3 rounded-lg text-gray-300 hover:bg-gray-800 hover:text-white transition-colors">
                    <i class="fa fa-dashboard w-5 text-center"></i>
                    <span>仪表盘</span>
                </a>
                <a href="users.html" class="flex items-center space-x-3 px-4 py-3 rounded-lg text-gray-300 hover:bg-gray-800 hover:text-white transition-colors">
                    <i class="fa fa-users w-5 text-center"></i>
                    <span>用户管理</span>
                </a>
                <a href="beta.html" class="flex items-center space-x-3 px-4 py-3 rounded-lg text-gray-300 hover:bg-gray-800 hover:text-white transition-colors">
                    <i class="fa fa-envelope w-5 text-center"></i>
                    <span>内测申请</span>
                </a>
                <a href="models.html" class="flex items-center space-x-3 px-4 py-3 rounded-lg bg-gray-800 text-white">
                    <i class="fa fa-cogs w-5 text-center"></i>
                    <span>系统配置</span>
                </a>
                <a href="logs.html" class="flex items-center space-x-3 px-4 py-3 rounded-lg text-gray-300 hover:bg-gray-800 hover:text-white transition-colors">
                    <i class="fa fa-list-alt w-5 text-center"></i>
                    <span>使用日志</span>
                </a>
            </nav>
            
            <div class="p-4 border-t border-gray-800">
                <div class="flex items-center space-x-3 px-4 py-3">
                    <div class="w-8 h-8 bg-gray-700 rounded-full flex items-center justify-center">
                        <i class="fa fa-user"></i>
                    </div>
                    <div class="flex-1">
                        <p id="adminName" class="text-sm font-medium">管理员</p>
                        <p class="text-xs text-gray-400">超级管理员</p>
                    </div>
                    <button id="logoutButton" class="text-gray-400 hover:text-white">
                        <i class="fa fa-sign-out"></i>
                    </button>
                </div>
            </div>
        </div>
        
        <!-- 主内容 -->
        <div class="flex-1 flex flex-col overflow-hidden">
            <!-- 顶部导航 -->
            <header class="bg-white shadow-sm z-10">
                <div class="flex items-center justify-between p-4">
                    <div class="flex items-center space-x-4">
                        <button id="sidebarToggle" class="text-gray-500 hover:text-gray-700">
                            <i class="fa fa-bars"></i>
                        </button>
                        <h2 class="text-lg font-semibold text-gray-900">系统配置</h2>
                    </div>
                    <div class="flex items-center space-x-4">
                        <div class="relative">
                            <button class="text-gray-500 hover:text-gray-700">
                                <i class="fa fa-bell"></i>
                                <span class="absolute top-0 right-0 w-2 h-2 bg-red-500 rounded-full"></span>
                            </button>
                        </div>
                        <div class="relative">
                            <button class="text-gray-500 hover:text-gray-700">
                                <i class="fa fa-cog"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </header>
            
            <!-- 内容区域 -->
            <main class="flex-1 overflow-y-auto p-6">
                <div class="bg-white rounded-xl card-shadow p-6 mb-6">
                    <h3 class="text-lg font-semibold text-gray-900 mb-4">系统配置管理</h3>
                    <div class="mb-6">
                        <label class="block text-sm font-medium text-gray-700 mb-2">配置分类</label>
                        <select id="configCategory" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-primary focus:border-primary">
                            <option value="">所有分类</option>
                            <option value="general">通用设置</option>
                            <option value="security">安全管理</option>
                            <option value="rate_limit">速率限制</option>
                            <option value="quota">额度配额</option>
                            <option value="points">积分设置</option>
                            <option value="api_keys">API密钥</option>
                        </select>
                    </div>
                    <div id="configList" class="space-y-4">
                        <!-- 配置项将通过JavaScript动态添加 -->
                        <div class="text-center py-10 text-gray-500">
                            加载中...
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    
    <script>
        let isAdminDev = false; // 全局：是否为 dev/super 角色

        document.addEventListener('DOMContentLoaded', function() {
            // 检查登录状态
            const adminToken = localStorage.getItem('admin_token');
            if (!adminToken) {
                window.location.href = 'index.html';
                return;
            }

            // 显示管理员信息 & 判断角色权限
            const adminUser = localStorage.getItem('admin_user');
            if (adminUser) {
                const admin = JSON.parse(adminUser);
                document.getElementById('adminName').textContent = admin.username || '管理员';
                // dev 或 super 角色才能修改敏感配置
                isAdminDev = (admin.role === 'dev' || admin.role === 'super' || admin.role === 'admin');
            }

            // 退出登录
            document.getElementById('logoutButton').addEventListener('click', function() {
                localStorage.removeItem('admin_token');
                localStorage.removeItem('admin_user');
                window.location.href = 'index.html';
            });

            // 加载配置
            loadConfigs();

            // 分类切换事件
            document.getElementById('configCategory').addEventListener('change', loadConfigs);
        });
        
        function loadConfigs() {
            const category = document.getElementById('configCategory').value;
            
            fetch(`/api/admin/configs?category=${category}`, {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Requested-With': 'XMLHttpRequest',
                    'Authorization': 'Bearer ' + localStorage.getItem('admin_token')
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    updateConfigList(data.data.configs);
                }
            })
            .catch(error => {
                console.error('加载配置失败:', error);
            });
        }
        
        function updateConfigList(configs) {
            const configList = document.getElementById('configList');
            
            if (Object.keys(configs).length > 0) {
                configList.innerHTML = '';
                
                Object.entries(configs).forEach(([category, items]) => {
                    const categoryDiv = document.createElement('div');
                    categoryDiv.className = 'mb-6';
                    categoryDiv.innerHTML = `
                        <h4 class="text-md font-semibold text-gray-900 mb-3">${getCategoryName(category)}</h4>
                        <div class="space-y-3">
                            ${items.map(item => `
                                <div class="flex items-center space-x-4 p-3 bg-gray-50 rounded-lg">
                                    <div class="flex-1">
                                        <p class="text-sm font-medium text-gray-900">${item.config_key}</p>
                                        <p class="text-xs text-gray-500">${item.config_description || '无描述'}</p>
                                    </div>
                                    <div class="w-56">
                                        ${item.config_type === 'boolean' ? `
                                            <select class="w-full px-3 py-1 border border-gray-300 rounded-lg" onchange="updateConfig('${item.config_key}', this.value)">
                                                <option value="1" ${item.config_value === '1' ? 'selected' : ''}>启用</option>
                                                <option value="0" ${item.config_value === '0' ? 'selected' : ''}>禁用</option>
                                            </select>
                                        ` : isSensitiveKey(item.config_key) ? `
                                            <div class="flex flex-col space-y-1 w-full">
                                                <div class="flex items-center space-x-2">
                                                    <span class="text-xs truncate max-w-[140px] ${item.config_value ? 'text-green-600 font-mono' : 'text-red-500'}">${item.config_value ? '●●●●●●●● 已配置(' + item.config_value.substring(0,4) + '...)' : '⚠ 未设置'}</span>
                                                    ${isAdminDev ? `<button type="button" class="px-2 py-0.5 text-xs bg-blue-50 text-blue-600 rounded hover:bg-blue-100 whitespace-nowrap" onclick="showKeyValue('${item.config_key}', '${(item.config_value||'').replace(/'/g,"\\'")}')">查看</button>` : ''}
                                                </div>
                                                ${isAdminDev ? `
                                                    <div class="flex items-center space-x-1">
                                                        <input id="edit_${item.config_key}" type="text" class="w-full px-2 py-0.5 text-xs border border-gray-300 rounded" placeholder="输入新值后点保存" onkeydown="if(event.key==='Enter')saveKey('${item.config_key}')">
                                                        <button type="button" class="px-2 py-0.5 text-xs bg-green-50 text-green-600 rounded hover:bg-green-100 whitespace-nowrap" onclick="saveKey('${item.config_key}')">保存</button>
                                                        <button type="button" class="px-2 py-0.5 text-xs bg-red-50 text-red-600 rounded hover:bg-red-100 whitespace-nowrap" onclick="deleteKey('${item.config_key}')">删除</button>
                                                    </div>
                                                ` : '<span class="text-xs text-gray-400">仅Dev可操作</span>'}
                                            </div>
                                        ` : `
                                            <input type="text" class="w-full px-3 py-1 border border-gray-300 rounded-lg" value="${item.config_value}" onchange="updateConfig('${item.config_key}', this.value)">
                                        `}
                                    </div>
                                    <div class="text-sm text-gray-500">${item.config_type}</div>
                                </div>
                            `).join('')}
                        </div>
                        
                        <!-- Dev专属：添加新配置项按钮 -->
                        ${isAdminDev && category === 'api_keys' ? `
                            <button type="button" class="mt-4 w-full py-2 text-sm border-2 border-dashed border-gray-300 rounded-lg text-gray-500 hover:border-primary hover:text-primary transition-colors" onclick="addNewKey()">
                                + 添加新API密钥
                            </button>
                        ` : ''}
                    `;
                    configList.appendChild(categoryDiv);
                });
            } else {
                configList.innerHTML = `
                    <div class="text-center py-10 text-gray-500">
                        暂无配置项
                    </div>
                `;
            }
        }
        
        function confirmUpdateKey(key) {
            const newValue = prompt('⚠️ 正在修改敏感配置：' + key + '\n\n请输入新值（留空则取消修改）：');
            if (newValue === null || newValue.trim() === '') return;
            
            fetch(`/api/admin/configs/${key}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Requested-With': 'XMLHttpRequest',
                    'Authorization': 'Bearer ' + localStorage.getItem('admin_token')
                },
                body: JSON.stringify({ value: newValue.trim() })
            })
            .then(response => response.json())
            .then(data => {
                alert(data.success ? '✅ 配置已更新' : '更新失败: ' + (data.error || data.message));
                if (data.success) loadConfigs();
            });
        }

        // Dev CRUD：查看密钥完整值
        function showKeyValue(key, value) {
            alert('🔑 ' + key + '\n\n值：' + value);
        }

        // Dev CRUD：保存密钥
        function saveKey(key) {
            const input = document.getElementById('edit_' + key);
            if (!input || !input.value.trim()) {
                alert('请输入新值'); return;
            }
            fetch(`/api/admin/configs/${key}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + localStorage.getItem('admin_token') },
                body: JSON.stringify({ value: input.value.trim() })
            }).then(r => r.json()).then(data => {
                alert(data.success ? '✅ 已更新' : '❌ 失败: ' + (data.error || ''));
                if (data.success) loadConfigs();
            });
        }

        // Dev CRUD：删除密钥
        function deleteKey(key) {
            if (!confirm('⚠️ 确定要删除配置：' + key + '？\n此操作不可恢复！')) return;
            fetch(`/api/admin/configs/${key}`, {
                method: 'DELETE',
                headers: { 'Authorization': 'Bearer ' + localStorage.getItem('admin_token') }
            }).then(r => r.json()).then(data => {
                alert(data.success ? '✅ 已删除' : '❌ 失败: ' + (data.error || ''));
                if (data.success) loadConfigs();
            });
        }

        // Dev CRUD：添加新密钥
        function addNewKey() {
            const newKey = prompt('请输入新的配置键名（如 api_key_openai）：');
            if (!newKey || !newKey.trim()) return;
            const newVal = prompt('请输入配置值：');
            if (!newVal && newVal !== '') return;
            const desc = prompt('请输入描述（可选）：') || '';
            fetch('/api/admin/configs', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + localStorage.getItem('admin_token') },
                body: JSON.stringify({ config_key: newKey.trim(), config_value: newVal.trim(), description: desc, category: 'api_keys' })
            }).then(r => r.json()).then(data => {
                alert(data.success ? '✅ 已添加' : '❌ 失败: ' + (data.error || ''));
                if (data.success) loadConfigs();
            });
        }
        
        function isSensitiveKey(key) {
            const sensitivePatterns = ['key', 'secret', 'password', 'token', 'api_', 'credential', 'private'];
            return sensitivePatterns.some(pattern => key.toLowerCase().includes(pattern));
        }
        
        function getCategoryName(category) {
            const categoryMap = {
                'general': '通用设置',
                'security': '安全管理',
                'rate_limit': '速率限制',
                'quota': '额度配额',
                'points': '积分设置',
                'api_keys': 'API密钥',
                'cache': '缓存配置',
                'budget': '预算管理'
            };
            return categoryMap[category] || category;
        }
        
        function updateConfig(key, value) {
            // 敏感字段：空值表示不修改
            if (isSensitiveKey(key) && !value) {
                alert('未输入新值，配置保持不变');
                return;
            }
            
            fetch(`/api/admin/configs/${key}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Requested-With': 'XMLHttpRequest',
                    'Authorization': 'Bearer ' + localStorage.getItem('admin_token')
                },
                body: JSON.stringify({ value: value })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    console.log('配置更新成功');
                } else {
                    alert('更新失败: ' + data.message);
                }
            })
            .catch(error => {
                console.error('更新配置失败:', error);
                alert('更新失败');
            });
        }
    </script>
</body>
</html>
