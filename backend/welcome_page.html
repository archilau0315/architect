<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>匡形无界智能科技 | KBITAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: white;
      overflow: hidden;
    }
    
    .bg-animation {
      position: fixed;
      inset: 0;
      background: 
        radial-gradient(ellipse at 20% 30%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 70%, rgba(139, 92, 246, 0.15) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 50%, rgba(236, 72, 153, 0.1) 0%, transparent 60%);
      animation: bgPulse 8s ease-in-out infinite;
    }
    
    @keyframes bgPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }
    
    .container {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 2rem;
    }
    
    .logo-container {
      margin-bottom: 2rem;
      animation: floatLogo 4s ease-in-out infinite;
    }
    
    @keyframes floatLogo {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    
    .logo {
      width: 140px;
      height: 140px;
      border-radius: 35px;
      object-fit: cover;
      box-shadow: 0 25px 50px -12px rgba(99, 102, 241, 0.4);
    }
    
    h1 {
      font-size: 3.5rem;
      font-weight: 900;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #fff 0%, #a5b4fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .subtitle {
      font-size: 1.2rem;
      color: #a5b4fc;
      margin-bottom: 1rem;
      font-weight: 400;
    }
    
    .slogan {
      font-size: 1rem;
      color: #818cf8;
      margin-bottom: 3rem;
      font-style: italic;
    }
    
    .enter-btn {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 20px 50px;
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #a855f7 100%);
      border: none;
      border-radius: 20px;
      font-size: 1.3rem;
      font-weight: 700;
      color: white;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 10px 40px rgba(99, 102, 241, 0.4);
      position: relative;
      overflow: hidden;
    }
    
    .enter-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.2) 0%, transparent 50%);
      opacity: 0;
      transition: opacity 0.3s;
    }
    
    .enter-btn:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 15px 50px rgba(99, 102, 241, 0.5);
    }
    
    .enter-btn:hover::before {
      opacity: 1;
    }
    
    .enter-btn .arrow {
      font-size: 1.5rem;
      transition: transform 0.3s;
    }
    
    .enter-btn:hover .arrow {
      transform: translateX(5px);
    }
    
    .features {
      display: flex;
      gap: 2rem;
      margin-top: 4rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    
    .feature {
      padding: 1.5rem 2rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      backdrop-filter: blur(10px);
      min-width: 180px;
    }
    
    .feature-icon {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }
    
    .feature-title {
      font-size: 0.9rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }
    
    .feature-desc {
      font-size: 0.75rem;
      color: #a5b4fc;
    }
    
    .footer {
      position: fixed;
      bottom: 2rem;
      font-size: 0.75rem;
      color: #64748b;
    }
    
    @media (max-width: 640px) {
      h1 { font-size: 2.5rem; }
      .enter-btn { padding: 16px 36px; font-size: 1.1rem; }
      .features { gap: 1rem; }
      .feature { min-width: 140px; padding: 1rem 1.5rem; }
    }
  </style>
</head>
<body>
  <div class="bg-animation"></div>
  
  <div class="container">
    <div class="logo-container">
      <img src="/architect/archi01.png" alt="KBITAI Logo" class="logo">
    </div>
    
    <h1>匡形无界智能科技</h1>
    <p class="subtitle">KBITAI · AI Image Architect</p>
    <p class="slogan">" 设计有形，科技无界 "</p>
    
    <a href="/architect/" class="enter-btn">
      <span>首席图像架构师</span>
      <span class="arrow">→</span>
    </a>
    
    <div class="features">
      <div class="feature">
        <div class="feature-icon">🎨</div>
        <div class="feature-title">图像架构</div>
        <div class="feature-desc">AI 驱动创意设计</div>
      </div>
      <div class="feature">
        <div class="feature-icon">🎬</div>
        <div class="feature-title">动态漫游</div>
        <div class="feature-desc">视频生成引擎</div>
      </div>
      <div class="feature">
        <div class="feature-icon">💬</div>
        <div class="feature-title">智能咨询</div>
        <div class="feature-desc">专业顾问服务</div>
      </div>
    </div>
  </div>
  
  <div class="footer">
    © 2024 KBITAI · 匡形无界智能科技
  </div>
</body>
</html>
