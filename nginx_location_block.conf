
    # ============================================
    # 首席图像架构师 - architect 前端配置
    # ============================================
    location /architect/ {
        alias /www/wwwroot/www_kbitai_com_cn/architect/;
        index index.html;
        try_files $uri $uri/ /architect/index.html;
    }

    # ============================================
    # 管理员后台 - admin 前端配置
    # ============================================
    location /admin/ {
        alias /www/wwwroot/www_kbitai_com_cn/architect/bankend/admin/;
        index index.php index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    # ============================================
    # API 路由配置（关键修复）
    # ============================================

    # 管理员API - 走PHP后端
    location /api/admin/ {
        rewrite ^/api/admin/(.*)$ /architect/bankend/index.php last;
    }

    # 其他API - 走Node.js后端
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # PHP处理
    location ~ ^/architect/bankend/.*\.php$ {
        fastcgi_pass unix:/tmp/php-cgi-82.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_connect_timeout 300;
        fastcgi_send_timeout 300;
        fastcgi_read_timeout 300;
    }
