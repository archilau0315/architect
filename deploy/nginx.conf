server {
    listen 80;
    listen 443 ssl;
    server_name www.kbitai.com.cn kbitai.com.cn;

    ssl_certificate /www/server/panel/vhost/cert/www.kbitai.com.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/www.kbitai.com.cn/privkey.pem;

    root /www/wwwroot/kbitai.com.cn;
    index index.html index.php;

    # ===== 首席图像架构师（2026-09 迁移：/architect/ → /aitools/architect/）=====
    # 旧地址 301 永久跳转（兼容微信文章、书签、外链）
    location = /architect {
        return 301 /aitools/architect/;
    }
    location ^~ /architect/ {
        rewrite ^/architect/(.*)$ /aitools/architect/$1 permanent;
    }

    # 新前端静态资源 + 单页应用路由回退
    location = /aitools/architect {
        return 301 /aitools/architect/;
    }
    location ^~ /aitools/architect {
        alias /www/wwwroot/kbitai.com.cn/aitools/architect;
        index index.html;
        try_files $uri $uri/ /aitools/architect/index.html;
    }

    # 水印 Logo 兜底：子应用路径 → 主站 public 目录
    location = /aitools/architect/LOGOkbitwater.png {
        rewrite ^ /public/LOGOkbitwater.png last;
    }

    # API代理 - 添加CORS头配置
    location /api/ {
        # 预检请求直接返回204
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '$http_origin' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, x-admin-key, x-user-id, X-Requested-With, Accept, Origin' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Max-Age' '86400' always;
            add_header 'Content-Length' '0' always;
            return 204;
        }

        # 跨域响应头
        add_header 'Access-Control-Allow-Origin' '$http_origin' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, x-admin-key, x-user-id, X-Requested-With, Accept, Origin' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        # 反向代理到后端
        proxy_pass http://localhost:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时配置（视频生成需要较长时间）
        proxy_connect_timeout 600;
        proxy_send_timeout 600;
        proxy_read_timeout 600;
        client_max_body_size 50M;
    }
}
