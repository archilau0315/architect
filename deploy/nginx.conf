# 首席图像架构师 - 子应用部署配置
# 部署路径: www.kbitai.com.cn/architect/

server {
    listen 80;
    listen 443 ssl http2;
    server_name www.kbitai.com.cn kbitai.com.cn;
    
    # 主站根目录
    root /www/wwwroot/kbitai.com.cn;
    index index.html index.php;
    
    # ============================================
    # 首席图像架构师 - 子应用配置
    # 访问地址: https://www.kbitai.com.cn/architect/
    # ============================================
    
    # 前端静态资源
    location /architect {
        alias /www/wwwroot/kbitai.com.cn/architect;
        index index.html;
        try_files $uri $uri/ /architect/index.html;
        
        # 静态资源缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }
    
    # 后端 API
    location /architect/backend {
        alias /www/wwwroot/kbitai.com.cn/architect/backend;
        index index.php;
        
        # 处理 PHP 文件
        location ~ \.php$ {
            if (!-f $request_filename) {
                return 404;
            }
            
            fastcgi_pass unix:/tmp/php-cgi-82.sock;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $request_filename;
            include fastcgi_params;
            
            # 超时设置
            fastcgi_connect_timeout 300;
            fastcgi_send_timeout 300;
            fastcgi_read_timeout 300;
        }
        
        # 处理 API 路由
        location ~ /architect/backend/(.*) {
            try_files $uri $uri/ /architect/backend/index.php?$query_string;
        }
    }
    
    # 管理后台
    location /architect/admin {
        alias /www/wwwroot/kbitai.com.cn/architect/admin;
        index index.html;
        try_files $uri $uri/ /architect/admin/index.html;
    }
    
    # ============================================
    # 主站其他配置 (保留原有配置)
    # ============================================
    
    # 主站前端
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # 禁止访问敏感文件
    location ~ /\.(env|git|gitignore|htaccess|htpasswd) {
        deny all;
        return 404;
    }
    
    # 禁止访问备份文件
    location ~* \.(bak|backup|sql|zip|tar|gz)$ {
        deny all;
        return 404;
    }
    
    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_comp_level 6;
    gzip_types 
        text/plain 
        text/css 
        text/xml 
        text/javascript 
        application/json 
        application/javascript 
        application/xml 
        application/xml+rss;
    
    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # 文件上传大小限制
    client_max_body_size 50M;
    client_body_buffer_size 128k;
}
