# 首席图像架构师 - 子应用部署配置
# 部署路径: www.kbitai.com.cn/architect/

server {
    listen 80;
    listen 443 ssl http2;
    server_name www.kbitai.com.cn kbitai.com.cn;
    
    # [SSL证书] 宝塔自动管理路径，请确认实际路径
    ssl_certificate /www/server/panel/vhost/cert/www.kbitai.com.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/www.kbitai.com.cn/privkey.pem;
    
    # 主站根目录
    root /www/wwwroot/kbitai.com.cn;
    index index.html index.php;
    
    # ============================================
    # 首席图像架构师 - 子应用配置
    # 访问地址: https://www.kbitai.com.cn/architect/
    # ============================================
    
    # 前端静态资源
    location /architect {
        alias /www/wwwroot/kbitai.com.cn/architect;
        index index.html;
        try_files $uri $uri/ /architect/index.html;
        
        # 静态资源缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }
    
    # 后端 API
    location /architect/backend {
        alias /www/wwwroot/kbitai.com.cn/architect/backend;
        index index.php;
        
        # 处理 PHP 文件
        location ~ \.php$ {
            if (!-f $request_filename) {
                return 404;
            }
            
            fastcgi_pass unix:/tmp/php-cgi-82.sock;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $request_filename;
            include fastcgi_params;
            
            # 超时设置
            fastcgi_connect_timeout 300;
            fastcgi_send_timeout 300;
            fastcgi_read_timeout 300;
        }
        
        # 处理 API 路由
        location ~ /architect/backend/(.*) {
            try_files $uri $uri/ /architect/backend/index.php?$query_string;
        }
    }
    
    # 管理后台
    location /architect/admin {
        alias /www/wwwroot/kbitai.com.cn/architect/admin;
        index index.html;
        try_files $uri $uri/ /architect/admin/index.html;
    }
    
    # ============================================
    # 通用 API 代理 - 所有 /api/* 转发到后端
    # ============================================
    location /api {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # CORS 支持
        proxy_set_header Access-Control-Allow-Origin $http_origin;
        proxy_set_header Access-Control-Allow-Credentials true;
        proxy_set_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';
        proxy_set_header Access-Control-Allow-Headers 'DNT,Authorization,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
        
        # 关键：超时设置（5分钟）
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
        
        # OPTIONS 预检请求处理
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin $http_origin;
            add_header Access-Control-Allow-Credentials true;
            add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';
            add_header Access-Control-Allow-Headers 'DNT,Authorization,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Type 'text/plain charset=UTF-8';
            add_header Content-Length 0;
            return 204;
        }
    }
    
    # ============================================
    # PH8 API 代理 - 生图/视频接口（已包含在上方通用规则中）
    # ============================================
    # location /api/ph8 已由上方 /api 规则代理
    # 此处保留用于特殊配置（如需要独立超时等）
    
    # ============================================
    # 主站其他配置 (保留原有配置)
    # ============================================
    
    # 主站前端
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # 禁止访问敏感文件
    location ~ /\.(env|git|gitignore|htaccess|htpasswd) {
        deny all;
        return 404;
    }
    
    # 禁止访问备份文件
    location ~* \.(bak|backup|sql|zip|tar|gz)$ {
        deny all;
        return 404;
    }
    
    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_comp_level 6;
    gzip_types 
        text/plain 
        text/css 
        text/xml 
        text/javascript 
        application/json 
        application/javascript 
        application/xml 
        application/xml+rss;
    
    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # 文件上传大小限制
    client_max_body_size 50M;
    client_body_buffer_size 128k;
}
